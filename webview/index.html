<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anonymous Rebuttal Coverage Dashboard</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --ink: #202833;
      --muted: #657180;
      --line: #d7dde5;
      --red: #9b1c1c;
      --green: #0b6b3a;
      --blue: #245d8f;
      --amber: #8a5a00;
      --shadow: 0 8px 22px rgba(32, 40, 51, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.42;
    }

    .shell {
      max-width: 1320px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr minmax(300px, 420px);
      gap: 14px;
      align-items: end;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      display: grid;
      gap: 9px;
    }

    .search {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 11px;
      background: var(--panel);
      font-size: 14px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 34px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font-weight: 800;
    }

    button.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 16px 0;
    }

    .stat, .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .stat {
      padding: 12px;
      min-height: 76px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 900;
    }

    .stat-label {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 12px;
    }

    .card {
      padding: 14px;
      min-width: 0;
    }

    h2, h3 {
      margin: 0;
      letter-spacing: 0;
    }

    h2 { font-size: 18px; }
    h3 { font-size: 16px; }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 3px 9px;
      background: #edf0f3;
      color: var(--ink);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .status-answered, .result-pass { background: #e8f4ee; color: var(--green); }
    .status-watch, .result-watch { background: #fff4d6; color: var(--amber); }
    .severity-p0 { background: #f7e5e5; color: var(--red); }
    .severity-p1 { background: #e9eff7; color: var(--blue); }

    .section-title {
      margin: 12px 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    ul {
      margin: 6px 0 0;
      padding-left: 19px;
    }

    li { margin: 4px 0; }

    .risk {
      margin-top: 8px;
      border-left: 4px solid var(--red);
      background: #fafbfc;
      border-radius: 0 8px 8px 0;
      padding: 8px 10px;
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }

    th {
      background: #edf0f3;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    tr:last-child td { border-bottom: 0; }

    @media (max-width: 820px) {
      .shell { padding: 14px 12px; }
      header { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1 id="title">Anonymous Rebuttal Coverage Dashboard</h1>
        <p class="subtitle" id="subtitle">Loading sanitized demo data...</p>
      </div>
      <div class="toolbar">
        <input id="search" class="search" type="search" placeholder="Filter issues, reviewers, gates">
        <div class="tabs" aria-label="Dashboard views">
          <button class="active" type="button" data-view="issues">Issue Board</button>
          <button type="button" data-view="reviewers">Reviewers</button>
          <button type="button" data-view="gates">Gate Timeline</button>
        </div>
      </div>
    </header>
    <section class="stats" id="stats"></section>
    <main id="content"></main>
  </div>

  <script>
    const state = { data: null, view: "issues", query: "" };
    const norm = (value) => String(value || "").toLowerCase();
    const slug = (value) => norm(value).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const matches = (value) => norm(value).includes(state.query);

    function el(tag, className = "", text = "") {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function addList(parent, title, items) {
      if (!items || !items.length) return;
      parent.appendChild(el("div", "section-title", title));
      const ul = el("ul");
      items.forEach((item) => ul.appendChild(el("li", "", item)));
      parent.appendChild(ul);
    }

    function issueText(issue) {
      return [issue.id, issue.title, issue.theme, issue.reviewers.join(" "), issue.severity, issue.status, issue.summary, issue.evidence.join(" "), issue.risk].join(" ");
    }

    function reviewerText(reviewer) {
      return [reviewer.id, reviewer.stance, reviewer.concerns.join(" ")].join(" ");
    }

    function renderStats() {
      const stats = document.getElementById("stats");
      stats.innerHTML = "";
      state.data.stats.forEach((item) => {
        const card = el("article", "stat");
        card.appendChild(el("div", "stat-value", item.value));
        card.appendChild(el("div", "stat-label", item.label));
        stats.appendChild(card);
      });
    }

    function issueCard(issue) {
      const card = el("article", "card");
      card.appendChild(el("h2", "", `${issue.id}: ${issue.title}`));
      const meta = el("div", "meta");
      meta.appendChild(el("span", `chip severity-${slug(issue.severity)}`, issue.severity));
      meta.appendChild(el("span", `chip status-${slug(issue.status)}`, issue.status));
      meta.appendChild(el("span", "chip", issue.theme));
      issue.reviewers.forEach((reviewer) => meta.appendChild(el("span", "chip", reviewer)));
      card.appendChild(meta);
      card.appendChild(el("p", "", issue.summary));
      addList(card, "Evidence", issue.evidence);
      card.appendChild(el("div", "section-title", "Risk Boundary"));
      card.appendChild(el("div", "risk", issue.risk));
      return card;
    }

    function reviewerCard(reviewer) {
      const card = el("article", "card");
      card.appendChild(el("h2", "", reviewer.id));
      card.appendChild(el("p", "", reviewer.stance));
      addList(card, "Concerns", reviewer.concerns);
      const covered = state.data.issues.filter((issue) => issue.reviewers.includes(reviewer.id));
      addList(card, "Response Anchors", covered.map((issue) => `${issue.id}: ${issue.title} (${issue.status})`));
      return card;
    }

    function renderIssues() {
      const filtered = state.data.issues.filter((issue) => matches(issueText(issue)));
      const grid = el("section", "grid");
      filtered.forEach((issue) => grid.appendChild(issueCard(issue)));
      replaceContent(grid);
    }

    function renderReviewers() {
      const filtered = state.data.reviewers.filter((reviewer) => matches(reviewerText(reviewer)));
      const grid = el("section", "grid");
      filtered.forEach((reviewer) => grid.appendChild(reviewerCard(reviewer)));
      replaceContent(grid);
    }

    function renderGates() {
      const rows = state.data.gate_runs.filter((gate) => matches([gate.gate, gate.result, gate.detail].join(" ")));
      const table = el("table");
      const thead = el("thead");
      const header = el("tr");
      ["Gate", "Result", "Detail"].forEach((name) => header.appendChild(el("th", "", name)));
      thead.appendChild(header);
      table.appendChild(thead);
      const body = el("tbody");
      rows.forEach((gate) => {
        const row = el("tr");
        row.appendChild(el("td", "", gate.gate));
        const result = el("td");
        result.appendChild(el("span", `chip result-${slug(gate.result)}`, gate.result));
        row.appendChild(result);
        row.appendChild(el("td", "", gate.detail));
        body.appendChild(row);
      });
      table.appendChild(body);
      replaceContent(table);
    }

    function replaceContent(node) {
      const content = document.getElementById("content");
      content.innerHTML = "";
      content.appendChild(node);
    }

    function render() {
      if (!state.data) return;
      renderStats();
      if (state.view === "reviewers") renderReviewers();
      else if (state.view === "gates") renderGates();
      else renderIssues();
    }

    document.getElementById("search").addEventListener("input", (event) => {
      state.query = norm(event.target.value);
      render();
    });

    document.querySelectorAll("button[data-view]").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll("button[data-view]").forEach((tab) => tab.classList.remove("active"));
        button.classList.add("active");
        state.view = button.dataset.view;
        render();
      });
    });

    fetch("sample_dashboard_data.json")
      .then((response) => response.json())
      .then((data) => {
        state.data = data;
        document.getElementById("title").textContent = data.title;
        document.getElementById("subtitle").textContent = `${data.subtitle}; generated_at=${data.generated_at}`;
        render();
      })
      .catch((error) => {
        document.getElementById("subtitle").textContent = `Could not load sample_dashboard_data.json: ${error.message}`;
      });
  </script>
</body>
</html>
