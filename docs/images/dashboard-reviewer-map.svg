  <text x="58" y="154" class="h ink">Reviewer Coverage Map</text>
  <circle cx="78" cy="216" r="24" fill="#d1fae5" stroke="#6ee7b7" stroke-width="3"/><text x="78" y="222" text-anchor="middle" class="small green">R1</text>
