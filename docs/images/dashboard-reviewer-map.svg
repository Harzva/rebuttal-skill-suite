  <text x="118" y="312" class="h ink">Skeptical about attribution and cost.</text>
  <text x="118" y="336" class="body muted">baseline fairness · runtime evidence · claim scope</text>
  <rect x="118" y="352" width="760" height="10" rx="5" fill="#e5e7eb"/><rect x="118" y="352" width="668" height="10" rx="5" fill="#00a88f"/>
