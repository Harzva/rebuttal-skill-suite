  <circle cx="78" cy="424" r="24" fill="#d1fae5" stroke="#6ee7b7" stroke-width="3"/><text x="78" y="430" text-anchor="middle" class="small green">R3</text>
  <text x="118" y="416" class="h ink">Concerned about weak cases and broader use.</text>
  <text x="118" y="440" class="body muted">failure boundary · deployment shift · negative cases</text>
  <rect x="118" y="456" width="760" height="10" rx="5" fill="#e5e7eb"/><rect x="118" y="456" width="638" height="10" rx="5" fill="#00a88f"/>
  <text x="910" y="464" class="h green">84%</text>
