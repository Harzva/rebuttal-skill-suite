  <text x="118" y="232" class="body muted">label use · fixed settings · table semantics</text>
  <rect x="118" y="248" width="760" height="10" rx="5" fill="#e5e7eb"/><rect x="118" y="248" width="699" height="10" rx="5" fill="#00a88f"/>
