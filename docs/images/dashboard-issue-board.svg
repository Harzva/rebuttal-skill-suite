  <text x="36" y="48" class="title ink">Dashboard Preview: Issue Board</text>
  <text x="36" y="74" class="body muted">Reviewer concerns are grouped by severity, evidence, status, and risk boundary.</text>
  <rect x="36" y="100" width="206" height="82" rx="14" class="panel shadow"/>
  <text x="52" y="138" class="stat ink">48</text>
  <text x="52" y="162" class="small muted">Issues</text>
  <rect x="262" y="100" width="206" height="82" rx="14" class="panel shadow"/>
  <text x="278" y="138" class="stat green">23</text>
  <text x="278" y="162" class="small muted">Resolved</text>
  <rect x="488" y="100" width="206" height="82" rx="14" class="panel shadow"/>
  <text x="504" y="138" class="stat ink">21</text>
  <text x="504" y="162" class="small muted">Open</text>
  <rect x="714" y="100" width="206" height="82" rx="14" class="panel shadow"/>
  <text x="730" y="138" class="stat red">3</text>
  <text x="730" y="162" class="small muted">P0 Blocking</text>
  <rect x="940" y="100" width="206" height="82" rx="14" class="panel shadow"/>
  <text x="956" y="138" class="stat amber">82/100</text>
  <text x="956" y="162" class="small muted">Avg Score</text>
  <rect x="36" y="220" width="546" height="112" rx="14" class="panel shadow"/>
  <text x="54" y="250" class="h ink">ISS-001 · Protocol separation</text>
  <text x="54" y="276" class="body muted">Separate deployable claims from calibrated diagnostics.</text>
  <rect x="54" y="292" width="42" height="24" rx="12" class="soft-red"/><text x="64" y="308" class="small red">P0</text>
  <rect x="104" y="292" width="76" height="24" rx="12" class="soft-blue"/><text x="114" y="308" class="small blue">blocking</text>
  <rect x="618" y="220" width="546" height="112" rx="14" class="panel shadow"/>
  <text x="636" y="250" class="h ink">ISS-002 · Private process leakage</text>
  <text x="636" y="276" class="body muted">Remove local paths, AI/tool traces, and strategy wording before public submission.</text>
  <rect x="636" y="292" width="42" height="24" rx="12" class="soft-red"/><text x="646" y="308" class="small red">P0</text>
  <rect x="686" y="292" width="76" height="24" rx="12" class="soft-blue"/><text x="696" y="308" class="small blue">blocking</text>
  <rect x="36" y="352" width="546" height="112" rx="14" class="panel shadow"/>
  <text x="54" y="382" class="h ink">ISS-003 · Unbounded deployment claim</text>
  <text x="54" y="408" class="body muted">Constrain deployment language to the evaluated protocol and named baselines.</text>
  <rect x="54" y="424" width="42" height="24" rx="12" class="soft-red"/><text x="64" y="440" class="small red">P0</text>
  <rect x="104" y="424" width="76" height="24" rx="12" class="soft-blue"/><text x="114" y="440" class="small blue">blocking</text>
  <rect x="618" y="352" width="546" height="112" rx="14" class="panel shadow"/>
  <text x="636" y="382" class="h ink">ISS-010 · Cost evidence</text>
  <text x="636" y="408" class="body muted">Report memory class, latency baseline, and route ratio.</text>
  <rect x="636" y="424" width="42" height="24" rx="12" class="soft-orange"/><text x="646" y="440" class="small orange">P1</text>
  <rect x="686" y="424" width="76" height="24" rx="12" class="soft-blue"/><text x="696" y="440" class="small blue">watch</text>
  <rect x="36" y="484" width="546" height="112" rx="14" class="panel shadow"/>
  <text x="54" y="514" class="h ink">ISS-011 · Mechanism attribution</text>
  <text x="54" y="540" class="body muted">Show that the gain is not only from a stronger component.</text>
  <rect x="54" y="556" width="42" height="24" rx="12" class="soft-orange"/><text x="64" y="572" class="small orange">P1</text>
  <rect x="104" y="556" width="76" height="24" rx="12" class="soft-blue"/><text x="114" y="572" class="small blue">watch</text>
  <rect x="618" y="484" width="546" height="112" rx="14" class="panel shadow"/>
  <text x="636" y="514" class="h ink">ISS-012 · Revision promises</text>
  <text x="636" y="540" class="body muted">Each promise names a table, caption, appendix, or artifact.</text>
  <rect x="636" y="556" width="42" height="24" rx="12" class="soft-orange"/><text x="646" y="572" class="small orange">P1</text>
  <rect x="686" y="556" width="76" height="24" rx="12" class="soft-blue"/><text x="696" y="572" class="small blue">watch</text>
  <rect x="36" y="616" width="546" height="112" rx="14" class="panel shadow"/>
  <text x="54" y="646" class="h ink">ISS-020 · Weak-case framing</text>
  <text x="54" y="672" class="body muted">Diagnose negative cases without inventing new evidence.</text>
  <rect x="54" y="688" width="42" height="24" rx="12" class="soft-amber"/><text x="64" y="704" class="small amber">P2</text>
  <rect x="104" y="688" width="76" height="24" rx="12" class="soft-blue"/><text x="114" y="704" class="small blue">open</text>
  <rect x="618" y="616" width="546" height="112" rx="14" class="panel shadow"/>
  <text x="636" y="646" class="h ink">ISS-021 · Table-caption clarity</text>
  <text x="636" y="672" class="body muted">Make strict, diagnostic, and sensitivity rows visually distinct.</text>
  <rect x="636" y="688" width="42" height="24" rx="12" class="soft-amber"/><text x="646" y="704" class="small amber">P2</text>
  <rect x="686" y="688" width="76" height="24" rx="12" class="soft-blue"/><text x="696" y="704" class="small blue">open</text>
</svg>
