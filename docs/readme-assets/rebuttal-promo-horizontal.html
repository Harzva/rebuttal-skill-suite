<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1600, initial-scale=1" />
  <title>Rebuttal Skill Suite Promo</title>
  <style>
    :root {
      --blue: #1167ff;
      --green: #10b981;
      --yellow: #f5a400;
      --purple: #7c3aed;
      --pink: #ec4899;
      --ink: #0b0d12;
      --muted: #4b5563;
      --line: #e7e2d8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 72% 8%, rgba(37, 99, 235, .15), transparent 20%),
        radial-gradient(circle at 96% 88%, rgba(16, 185, 129, .18), transparent 18%),
        linear-gradient(135deg, #fffaf0 0%, #fffefd 52%, #eef7ff 100%);
    }
    .canvas {
      position: relative;
      width: 1600px;
      height: 900px;
      padding: 54px 72px 48px;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 22px;
      height: 94px;
    }
    .mark {
      width: 92px;
      height: 92px;
      border-radius: 29px;
      background: conic-gradient(from 210deg, var(--blue), var(--green), var(--yellow), var(--purple), var(--blue));
      padding: 7px;
      box-shadow: 0 18px 34px rgba(17, 103, 255, .2);
    }
    .mark-inner {
      height: 100%;
      border-radius: 24px;
      background: #fff;
      display: grid;
      place-items: center;
      position: relative;
    }
    .doc {
      width: 44px;
      height: 56px;
      border: 5px solid #0b0d12;
      border-radius: 8px;
      position: relative;
    }
    .doc:after {
      content: "";
      position: absolute;
      right: -5px;
      top: -5px;
      width: 19px;
      height: 19px;
      border-left: 5px solid #0b0d12;
      border-bottom: 5px solid #0b0d12;
      background: #fff;
    }
    .doc span {
      position: absolute;
      left: 8px;
      right: 8px;
      height: 5px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--blue), var(--green));
    }
    .doc span:nth-child(1) { top: 22px; }
    .doc span:nth-child(2) { top: 35px; background: var(--yellow); }
    .brand h2 {
      margin: 0;
      font-size: 46px;
      line-height: 1;
      letter-spacing: 0;
    }
    .badge {
      display: inline-flex;
      margin-top: 13px;
      padding: 8px 18px;
      border-radius: 999px;
      background: #0b0d12;
      color: white;
      font-size: 23px;
      font-weight: 800;
    }
    .star {
      margin-left: 14px;
      color: var(--yellow);
      font-size: 34px;
      line-height: 1;
    }
    .hero {
      margin-top: 28px;
      width: 880px;
      position: relative;
      z-index: 2;
    }
    h1 {
      margin: 0;
      font-size: 89px;
      line-height: 1.13;
      font-weight: 1000;
      letter-spacing: 0;
    }
    .underline {
      width: 560px;
      height: 14px;
      border-radius: 999px;
      background: var(--yellow);
      transform: rotate(-2deg);
      margin: 18px 0 22px 14px;
    }
    .slug {
      font-size: 56px;
      font-weight: 1000;
      line-height: 1.05;
      letter-spacing: 0;
      background: linear-gradient(90deg, var(--blue), var(--green), var(--yellow), var(--pink), var(--purple));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subpill {
      display: inline-flex;
      margin-top: 18px;
      padding: 15px 28px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .72);
      box-shadow: 0 10px 24px rgba(15, 23, 42, .06);
      font-size: 28px;
      font-weight: 800;
    }
    .ring {
      position: absolute;
      right: 88px;
      top: 96px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: conic-gradient(var(--blue), #22d3ee, var(--green), var(--yellow), var(--pink), var(--purple), var(--blue));
      padding: 20px;
      box-shadow: 0 0 38px rgba(37, 99, 235, .28);
    }
    .ring:before {
      content: "";
      position: absolute;
      inset: 45px;
      border-radius: 50%;
      background: #fffaf0;
    }
    .ring-card {
      position: absolute;
      inset: 105px 82px;
      border-radius: 34px;
      background: #0b0d12;
      transform: rotate(-5deg);
      color: white;
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 40px;
      line-height: 1.08;
      font-weight: 1000;
      box-shadow: 0 22px 42px rgba(15, 23, 42, .28);
    }
    .feature-row {
      position: absolute;
      left: 72px;
      right: 72px;
      top: 570px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }
    .feature {
      min-height: 108px;
      border: 2px solid #eee8dd;
      border-radius: 26px;
      background: rgba(255,255,255,.82);
      box-shadow: 0 12px 26px rgba(15,23,42,.08);
      display: grid;
      grid-template-columns: 72px 1fr;
      align-items: center;
      gap: 18px;
      padding: 18px 22px;
    }
    .icon {
      width: 70px;
      height: 70px;
      border-radius: 18px;
      color: white;
      display: grid;
      place-items: center;
      font-size: 30px;
      font-weight: 1000;
    }
    .blue { background: linear-gradient(135deg, #1d74ff, #68a6ff); }
    .green { background: linear-gradient(135deg, #10b981, #33d399); }
    .yellow { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
    .purple { background: linear-gradient(135deg, #7c3aed, #a78bfa); }
    .feature h3 { margin: 0 0 5px; font-size: 26px; line-height: 1.12; }
    .feature p { margin: 0; font-size: 21px; line-height: 1.18; color: #111827; font-weight: 700; }
    .proof {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 32px;
      height: 184px;
      border: 2px solid #eee8dd;
      border-radius: 32px;
      background: rgba(255,255,255,.86);
      box-shadow: 0 16px 34px rgba(15,23,42,.08);
      display: grid;
      grid-template-columns: 1.07fr .93fr;
      overflow: hidden;
    }
    .terminal {
      padding: 18px 34px;
      border-right: 2px solid #eee8dd;
    }
    .term-head {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .dot { width: 14px; height: 14px; border-radius: 50%; background: #ef4444; }
    .dot:nth-child(2) { background: #f59e0b; }
    .dot:nth-child(3) { background: #22c55e; }
    .term-line {
      height: 18px;
      margin: 8px 0;
      border-radius: 999px;
      background: #e5e7eb;
    }
    .term-line:nth-child(2) { width: 78%; background: linear-gradient(90deg, #dbeafe, #ccfbf1); }
    .term-line:nth-child(3) { width: 62%; }
    .term-line:nth-child(4) { width: 86%; background: linear-gradient(90deg, #fef3c7, #ede9fe); }
    .term-label {
      display: inline-flex;
      margin-top: 0;
      padding: 7px 14px;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
      font-weight: 1000;
      font-size: 20px;
    }
    .checks {
      padding: 24px 34px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      align-content: center;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 23px;
      font-weight: 900;
    }
    .check b {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      background: var(--green);
      font-size: 22px;
    }
    .confetti {
      position: absolute;
      width: 16px;
      height: 50px;
      border-radius: 999px;
      transform: rotate(35deg);
      opacity: .9;
    }
    .c1 { right: 54px; top: 210px; background: var(--blue); }
    .c2 { right: 82px; top: 280px; background: var(--green); }
    .c3 { right: 42px; top: 355px; background: var(--purple); }
    .c4 { right: 600px; top: 122px; background: var(--yellow); height: 34px; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="topbar">
      <div class="mark"><div class="mark-inner"><div class="doc"><span></span><span></span></div></div></div>
      <div class="brand">
        <h2>Rebuttal Skill Suite <span class="star">*</span></h2>
        <div class="badge">Academic-native</div>
      </div>
    </div>

    <section class="hero">
      <h1>把学术 Rebuttal<br>变成可验证闭环</h1>
      <div class="underline"></div>
      <div class="slug">Harzva / rebuttal-skill-suite</div>
      <div class="subpill">审稿人格 + 泄漏审计 + 证据门禁 + 发布校验</div>
    </section>

    <div class="ring"><div class="ring-card">P0 / P1 / P2<br>风险闭环</div></div>
    <div class="confetti c1"></div><div class="confetti c2"></div><div class="confetti c3"></div><div class="confetti c4"></div>

    <section class="feature-row">
      <div class="feature"><div class="icon blue">P0</div><div><h3>高危先拦</h3><p>矛盾与泄漏</p></div></div>
      <div class="feature"><div class="icon green">AC</div><div><h3>审稿人格</h3><p>独立攻击回复</p></div></div>
      <div class="feature"><div class="icon yellow">OK</div><div><h3>机械门禁</h3><p>脚本反复校验</p></div></div>
      <div class="feature"><div class="icon purple">1P</div><div><h3>版面就绪</h3><p>一页回复安全</p></div></div>
    </section>

    <section class="proof">
      <div class="terminal">
        <div class="term-head"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
        <div class="term-line"></div>
        <div class="term-line"></div>
        <div class="term-line"></div>
        <span class="term-label">SUITE_VALIDATE_OK</span>
      </div>
      <div class="checks">
        <div class="check"><b>✓</b> Claim ledger</div>
        <div class="check"><b>✓</b> Leak audit</div>
        <div class="check"><b>✓</b> Tone check</div>
        <div class="check"><b>✓</b> Release package</div>
      </div>
    </section>
  </main>
</body>
</html>
