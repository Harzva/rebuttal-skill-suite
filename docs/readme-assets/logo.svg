    <rect x="145" y="133" width="222" height="252" rx="30" fill="none" stroke="#dbeafe" stroke-width="4"/>
  </g>
  <rect x="175" y="170" width="162" height="20" rx="10" fill="#2563eb"/>
  <rect x="175" y="212" width="120" height="14" rx="7" fill="#94a3b8"/>
  <rect x="175" y="242" width="148" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="175" y="272" width="98" height="14" rx="7" fill="#cbd5e1"/>

