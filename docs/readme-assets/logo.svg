  <path d="M355 115l9 61-59-17" fill="none" stroke="url(#loop)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M156 397l-9-61 59 17" fill="none" stroke="url(#loop)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#softShadow)">
