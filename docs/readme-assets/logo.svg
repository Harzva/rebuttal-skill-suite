<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Rebuttal Skill Suite logo</title>
  <desc id="desc">Three review cards move through an evidence loop toward a verified response.</desc>
  <defs>
    <linearGradient id="bg" x1="78" y1="64" x2="430" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="loop" x1="116" y1="126" x2="401" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.52" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#bg)"/>
  <path d="M356 151c39 31 61 82 53 132-6 42-32 81-70 102" fill="none" stroke="url(#loop)" stroke-width="20" stroke-linecap="round"/>
